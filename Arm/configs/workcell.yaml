# The workcell: frames, tool, zones, observation poses, placement slots, limits (SF-11).
# Loaded before any motion by rfp_arm.workcell; unknown entries are errors.
#
# Units: meters, degrees, seconds. Every position is in the arm base frame {B}
# (MoveIt's base_link: z up, origin at the middle of the base).
#
# !! THE VALUES BELOW ARE PLACEHOLDERS for simulation, not a measured cell. Before the
# !! real arm moves: measure the table, zones and tool, teach the observation poses,
# !! calibrate the camera, then set `verified: true`. Dry runs and real runs refuse to
# !! start while it is false.
verified: false

robot:
  group: fairino5_v6_group        # MoveIt planning group (fairino5_v6_moveit2_config)
  base_frame: base_link
  # Last link of the group. Its origin is on the j6 axis; the URDF has no flange link.
  # By the FR5's dimensions the flange face should be 100 mm further along +z: check it
  # (pick_place.py --mode check compares it with the controller's flange pose).
  tip_link: wrist3_link
  joints: [j1, j2, j3, j4, j5, j6]

tool:
  # TCP in the tip link frame (AS-65): center of the cup footprint, in the plane of the
  # uncompressed cup faces; z out of the cups, x along the footprint's long side.
  # 145.8 mm past the flange on the gripper's CAD model (Simulation/import_gripper.py).
  tcp: {xyz: [0.0, 0.0, 0.2458], rpy_deg: [0, 0, 0]}
  # How far the last joint (j6) may turn. The vacuum tube runs into the gripper, so the
  # wrist must never wind a full turn: plans that leave this range are refused, each grasp
  # takes the way round that turns it least (and keeps 10 degrees clear of the ends if it
  # can), and the arm returns to its observation pose (and this joint to its angle there)
  # after every fish. Put 0 where the tube hangs free.
  wrist_range_deg: [-170, 170]
  # Cups, bracket and camera as one box in the tip link frame, for MoveIt's collision
  # checks. Keep its far end short of the cup faces, or reaching a fish counts as a hit.
  body: {x: [-0.100, 0.100], y: [-0.123, 0.050], z: [0.100, 0.226]}
  # The arm's own body, the FR5's links and this gripper, as spheres (at most 1 cm past
  # them): every planned path and pose is checked so the arm never runs into itself.
  # Simulation/make_collision_model.py makes it from the meshes: run it again after
  # changing the gripper. In this folder; "": not checked.
  collision_model: collision_model.yaml

camera:
  # The camera's optical frame (z out of the lens, x right, y down in the image) in the
  # tip link frame: the hand-eye calibration result (AS-60). Keep the lens at least 70 mm
  # above the cup faces: the D405 measures no depth closer than that. Nominal: the middle
  # of the D405's front face on the gripper's CAD model, 83 mm above the cup faces.
  mount: {xyz: [0.0, -0.104, 0.163], rpy_deg: [0, 0, 0]}
  calibrated: false               # true once calibrated and checked (AS-61); real runs need it
  calibration_version: nominal-0  # recorded in the run log (AS-64)

table:
  z: 0.0            # table surface
  clearance: 0.005  # the cups and the camera stay at least this far above it (SF-13)

zones:
  # The work zone is the table (SF-15). A fish reaches half its length past its grasp
  # point, so the table has to be that much larger than the pick area on every side.
  work: {x: [-0.40, 1.30], y: [-0.85, 0.85], height: 1.0}
  pick_area: {x: [0.20, 0.60], y: [-0.35, 0.15]}             # SY-15
  placement: {x: [0.15, 0.55], y: [0.30, 0.72]}              # AS-51
  exclusion:                                                 # SF-12
    - {name: operator side, x: [1.00, 1.30], y: [-0.85, 0.85], z: [0.00, 1.50]}

observation:
  height: 0.45      # camera above the table (AS-11)
  # Each pose: where the camera looks straight down from (camera_xy; yaw_deg turns the
  # image's x axis from +X toward +Y), or taught joint angles (joints_deg: [j1, ..., j6],
  # from `ros2 topic echo /joint_states --once`, converted to degrees). Taught joints are
  # the safer choice on the real arm: the posture is exactly the one taught (pick_place.py
  # --mode check prints the joints in degrees). Teach them with j6 near the middle of its
  # range: from there the wrist turns up to about 160 degrees either way to grasp a fish
  # and bring it to the placement heading.
  poses:
    - {name: right, camera_xy: [0.40, -0.18], yaw_deg: -90}   # the FR5 wrist (j6) near 0
    - {name: left, camera_xy: [0.40, 0.02], yaw_deg: -90}
  # A fish cut off at the image's edge gets a look centered on it: the camera straight above
  # its middle, the image's long side along the fish, this high above the table. There the
  # long side spans about 1.9 x (this - the fish's height): 0.62 holds a 0.79 m printed
  # stand-in (up to 0.19 m tall) whole. Leave it out for no such looks.
  close_height: 0.62

placement:
  heading_deg: 0    # where placed fish point their heads: degrees from +X toward +Y (AS-52)
  slots:            # slot centers, filled in this order (AS-56)
    - [0.36, 0.37]
    - [0.20, 0.57]

motion:
  tcp_speed_max: 0.25           # m/s, every motion (SF-21, AS-42); plans above it are refused
  tcp_accel_max: 0.5            # m/s2 on straight moves (AS-43)
  approach_speed: 0.05          # m/s onto the fish (AS-22)
  carry_speed: 0.15             # m/s, straight moves with a fish
  free_speed: 0.15              # m/s, straight moves without a fish
  ptp_velocity_scale: 0.10      # point-to-point: share of the joint speed limits
  ptp_acceleration_scale: 0.10
  max_joint_travel_deg: 200     # a plan turning a joint further is refused
  goal_tolerance: 0.002         # m (AS-12 asks for 0.001: tighten once the arm is characterized)
  planning_time: 5.0
  pilz_max_trans_vel: 1.0       # MoveIt's pilz_cartesian_limits.yaml, used if it can't be read
  pilz_max_trans_acc: 2.25
  carry_ptp_fallback: true      # carry point-to-point if no straight path is found (a
                                # straight carry turns the tool the short way, which can wind
                                # the wrist into its stop where the planned turn doesn't)

grasp:                          # Table AS-1
  pregrasp_distance: 0.10
  press_distance: 0.010
  dry_run_standoff: 0.05
  lift_length_share: 0.6
  lift_margin: 0.05
  lift_height_max: 0.50
  release_clearance: 0.015
  retreat_distance: 0.10
  seal_timeout: 1.0
  seal_dwell: 1.0               # no vacuum switch: time for the vacuum to build up
  release_dwell: 1.0            # no vacuum switch: time for it to let go
  drop_time: 0.1
  release_timeout: 1.0
  max_approach_tilt_deg: 15     # the cups lean at most this far onto a sloping fish (AS-21)
  # Feeling for the fish. On the real arm the joint torques tell when something pushes
  # back: from feel_start above where the camera saw the fish's surface the cups go down
  # in small steps until contact_force is felt, then press_distance further (or until
  # press_force_max). No contact by feel_max_depth past the expected surface: no fish
  # there (E_NO_SEAL). Tune the forces with: pick_place.py --mode feel
  feel_contact: true            # false: go to the expected surface + press_distance, blind
  feel_start: 0.015
  feel_step: 0.003
  feel_speed: 0.01
  feel_settle: 0.15
  contact_force: 15.0           # N, tune
  press_force_max: 40.0         # N, tune
  feel_max_depth: 0.025
  # Controller commands sent before pressing and after the hold is confirmed, as written
  # for ros2_cmd_server. This is where a compliant wrist would be switched on and off, so
  # the cups settle onto the fish by themselves, e.g. the controller's impedance mode:
  #   ImpedanceControlStartStop(status, workSpace, forceThreshold x6, m x6, b x6, k x6,
  #                             maxV, maxVA, maxW, maxWA)     (0: joint space)
  # Left empty: its parameters have to be found on the arm, without a fish first.
  press_start_commands: []
  press_end_commands: []

gripper:
  # What switches the vacuum of the six cups:
  #   serial      the ESP32 valve board over USB (firmware: Arm/firmware/valve_control)
  #   http        the same board over Wi-Fi
  #   controller  the FR5 control box's digital I/O (HW-33, HW-34), with a vacuum switch
  # The valve board confirms each switch but can't tell whether the cups hold: with it,
  # the camera confirms the hold. Try it with: python Arm/scripts/gripper_bench.py on
  driver: serial
  serial_port: /dev/ttyACM0     # Windows: COM3, ...
  serial_baud: 115200
  http_host: ""                 # 192.168.4.1 on the board's own access point
  valve_timeout: 2.0
  valve_inverted: false         # true: the vacuum is on while the valve is off
  # driver: controller only
  vacuum_do: 0
  blowoff_do: 1
  holding_di: 0
  vacuum_di: 1
  vacuum_switch: true           # false: no switch wired; the camera confirms the hold
  blowoff_time: 0.2
  state_timeout: 0.5
