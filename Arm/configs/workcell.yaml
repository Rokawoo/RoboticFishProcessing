# The cell as measured, in the arm's base frame {B} (MoveIt's base_link: z up, origin in the
# middle of the base), in meters and degrees. Speeds and limits: control_panel.yaml (a setting
# is in one file or the other). Unknown entries are errors.
#
# !! PLACEHOLDERS until the cell is measured: measure the table, zones and tool, teach the
# !! observation poses, calibrate the camera, then set `verified: true` in control_panel.yaml.

robot:
  group: fairino5_v6_group        # MoveIt planning group
  base_frame: base_link
  tip_link: wrist3_link           # origin on the j6 axis; the flange face is 100 mm further along z
  joints: [j1, j2, j3, j4, j5, j6]

tool:
  # TCP in the tip link frame: the middle of the cup faces (uncompressed), z out of the cups,
  # x along the cup rows. Simulation/import_gripper.py measures it from the CAD model.
  tcp: {xyz: [0.0, 0.0, 0.2458], rpy_deg: [0, 0, 0]}
  # Cups, bracket and camera as one box (tip link frame) for MoveIt; short of the cup faces
  body: {x: [-0.100, 0.100], y: [-0.123, 0.050], z: [0.100, 0.226]}
  # The arm and gripper as spheres, checked on every path; Simulation/make_collision_model.py
  # makes it (run it again after changing the gripper). "": not checked
  collision_model: collision_model.yaml

camera:
  # The lens frame (z out of the lens, x right and y down in the image) in the tip link frame.
  # Mounted upside down (the arm went the opposite way to the fish): rpy_deg [0, 0, 180].
  # Until calibrated, a dry run or run measures it first and saves it here (--calibrate: again).
  mount: {xyz: [0.0, -0.104, 0.163], rpy_deg: [0, 0, 0]}
  calibrated: false
  calibration_version: nominal-0  # in the run log

table:
  z: 0.0
  clearance: 0.005  # the cups and camera stay this far above it

zones:
  # The table: a fish reaches half its length past the cups, so it has to be that much
  # larger than the pick area all round
  work: {x: [-0.79, 0.85], y: [-0.97, 0.90], height: 1.00}
  pick_area: {x: [-0.225, 0.28], y: [-0.62, -0.18]}
  placement: {x: [-0.69, -0.30], y: [-0.60, -0.11]}
  exclusion:                      # keep-out boxes
    - {name: operator side, x: [-0.79, 0.85], y: [0.60, 0.90], z: [0.00, 1.50]}

observation:
  height: 0.45      # camera above the table
  # Where the search looks from: camera_xy, straight down (yaw_deg turns the image's x axis
  # from +X toward +Y), or taught joints_deg [j1, ..., j6] (--mode check prints them). j6 near 0.
  poses:
    - {name: over the pick area, camera_xy: [0.028, -0.40], yaw_deg: 180}
  close_height: 0.62  # highest look over one fish (camera above the table); leave out: none

placement:
  # Where placed fish's middles go, used in turn. One is enough: each placed fish is taken
  # away. More are optional.
  slots:
    - [-0.46, -0.365]
