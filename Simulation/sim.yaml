# The 3D simulation (pick_place.py --mode sim3d), rfp_sim.settings.SimSettings.
# The control panel's `simulation` section overrides these. Units: meters, seconds, newtons.

# The fish
fish_model: models/catfish.3mf  # .3mf or .stl, relative to Simulation/; missing: a plain shape
fish_length: 0.79               # m snout to tail fin; the model is scaled to it (0.79: the
                                # printed stand-ins, vision's fish_type stand_in)
fish_head: "-x"                 # the model's axis toward the head (catfish.3mf: -x)
fish_up: "+z"                   # the model's axis pointing up as it lies on the table
fish_count: 1
seed: 1                         # where the fish lie; another number, another layout
placement: anywhere             # view: each fish where an observation pose sees all of it,
                                # within max_heading_offset_deg of the image's long side (the
                                # easy case); anywhere: anywhere in the pick area at any
                                # heading, as fish really lie
max_heading_offset_deg: 15
fish_color: [0.93, 0.93, 0.9]   # the white printed stand-in

# The arm and the gripper
robot_meshes: ""                # folder with the FR5's STL files (frcobot_ros2:
                                # fairino_description/meshes/fairino5_v6); "": a sourced ROS
                                # workspace's, else FAIRINO's downloaded to models/fr5/
download_robot_meshes: true     # fetch FAIRINO's FR5 meshes once (no license: not in Git);
                                # false or no network: the arm is drawn as plain tubes
speed: 1.0                      # simulated seconds per real second; 0: as fast as it renders
step_s: 0.05                    # simulated seconds between drawn arm poses
gripper_model: models/gripper.stl  # cups, plate, camera, bracket: from its CAD model by
                                # import_gripper.py, which prints the values below
cup_rows: [-0.08, 0.0, 0.08]    # cup centers along the tool's x (m): 3 x 2 cups
cup_columns: [-0.03, 0.03]      # and along its y
cup_stroke: 0.030               # how far a cup compresses: the 40 mm bellows to about 10 mm
cup_stiffness: 500.0            # N/m per cup
seal_cups: 5                    # cups that must touch for the vacuum to hold the fish
seal_gap: 0.002                 # m: a cup face this close to the fish touches it
drop: ""                        # lift | carry: lose the first fish then (tests drop detection)

# The camera (the D405 on the gripper)
width: 1280
height: 720
hfov_deg: 87.0
depth_range_m: [0.07, 1.0]      # outside it the D405 gives no depth
depth_noise_m: 0.0005
depth_edge_holes_px: 3          # no depth this close to a depth step, as on the D405 (0: off)
detector: model                 # model: the trained YOLO; truth: the renderer's own outlines

# The 3D window
window: [1280, 800]
