# Fish segmentation training settings for train.py.
# Any Ultralytics train argument works (https://docs.ultralytics.com/modes/train/#train-settings);
# omitted ones use Ultralytics' defaults. Relative paths are relative to this file.
# Override on the command line: python train.py epochs=5 batch=8

model: yolo26m-seg.pt             # downloaded for the run, deleted after; n < s < m < l < x
data: ../dataset/train/data.yaml  # written by the splitter
project: ../../trained_cv_models  # run folder: <name>_<model>_<date>_<time>/
name: fish_seg                    # also the MLflow experiment name

epochs: 300                  # upper limit; early stopping ends sooner
patience: 50
imgsz: 640                   # long side of the 1280x720 D405 frames; try 960 if mask edges are coarse
batch: -1                    # auto: largest batch in ~60% of GPU memory
cache: disk                  # .npy next to the images; 'ram' is faster but not exactly repeatable
workers: 8

# Augmentation for a top-down camera at a fixed pose: fish at any heading, several per image.
degrees: 180                 # any heading is real
fliplr: 0.5                  # a mirrored left-side fish looks like a right-side fish
flipud: 0.5                  # top-down: no "up"
scale: 0.3                   # fixed camera height (default 0.5)
translate: 0.1
shear: 0.0
perspective: 0.0             # fixed camera pose
hsv_h: 0.015
hsv_s: 0.5                   # wet vs dry skin (default 0.7)
hsv_v: 0.3                   # controlled lighting (default 0.4)
mosaic: 1.0
close_mosaic: 15             # last epochs on whole images, as the camera sees them
mixup: 0.0                   # blended, see-through fish never happen
copy_paste: 0.3              # mirrored copies of 30% of the fish into free spots of the image
