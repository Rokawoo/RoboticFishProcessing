# Vision thresholds and camera settings (rfp_vision.settings.VisionSettings).
# Units: meters, degrees, pixels. Unknown names are errors. Defaults are the Requirement
# Spec's values; the ones marked "tune" are first guesses to adjust on the real cell.

# Camera (VS-11). hfov_deg is only used for cameras that don't report intrinsics
# (webcams, plain videos); the D405 reports its own.
width: 1280
height: 720
fps: 30
hfov_deg: 87.0

# Detection (VS-20, VS-61, VS-24)
predict_conf: 0.25          # the model's own threshold: weaker detections aren't listed
min_confidence: 0.50        # below: low_confidence
min_area_share: 0.03        # of the frame; smaller detections aren't fish
border_margin_px: 8         # an outline this close to the image edge: out_of_frame

# Depth (VS-45, VS-66). With use_depth false, or a camera without depth, each fish is
# placed on the table plane with default_thickness_m.
use_depth: true
depth_range_m: [0.10, 0.75]  # a close look from 0.62 m sees a flat fish's top ~0.55 m away
depth_window_m: 0.025
min_depth_valid: 0.80
default_thickness_m: 0.10
outline_height_share: 0.5   # tune: the outline is seen at about half the fish's height
# With depth, a plane is fitted to the fish's surface under the cups: the cups are tilted
# onto it, and the slope along the body (down toward the tail) helps tell head from tail.
align_to_surface: true      # false: always approach straight down
max_surface_tilt_deg: 15    # a steeper surface is approached straight down (AS-21)
surface_fit_rms_m: 0.012    # tune: a rougher fit isn't trusted

# Heading from the outline's shape (fish_heading.py). With require_heading false, a fish
# whose head end is unknown is still picked, and placed along the slot's axis.
require_heading: true
min_heading_confidence: 0.6 # tune

# Geometry checks (VS-65, VS-33): a fish measured outside these isn't picked. fish_type says
# whose limits apply: stand_in (the printed fish, while testing) or catfish (real ones).
check_size: true
fish_type: stand_in
stand_in:                   # the 0.79 m printed catfish as vision measures it (simulation):
  length_range_m: [0.80, 1.00]      #   ~0.90 m: it reads ~14% long (its ends are raised)
  width_range_m: [0.14, 0.25]       #   ~0.18 m across at its middle (0.23 by its fins)
  thickness_range_m: [0.15, 0.21]   #   ~0.17 m tall. Other stand-ins: measure with
                                    #   pick_place.py --mode observe and set these
  balance_ahead_share: 0.126        # where it balances (the cups still seal there at 0.79 m)
catfish:                    # Table SY-1 +- 10%
  length_range_m: [0.54, 0.825]
  width_range_m: [0.0945, 0.154]
  thickness_range_m: [0.081, 0.132]
  balance_ahead_share: 0.065        # it balances ~0.11 ahead, but the cups must seal behind
                                    # its pectoral fins (0.06-0.09 for 0.55-0.79 m): tune
cup_footprint_m: [0.20, 0.10]    # along and across the body (the gripper's CAD model)
grasp_step_m: 0.01               # where the cups don't all seal at the balance point (the
                                 # fins), they move back toward the middle in these steps
cup_diameter_m: 0.04             # six of them, 3 x 2, filling the footprint
cup_stroke_m: 0.025              # the unevenness under the cups the bellows take up and still
                                 # all seal: they compress from 40 mm to about 10 mm, less 5 mm
                                 # the last cup to touch is still pressed by
cup_lip_conform_m: 0.006         # a bump under one cup's lip (a fin) taller than this keeps
                                 # that cup off the fish: the spot isn't used
overlap_margin_px: 6

# A fish is valid only if it is at the same place in this many frames in a row (VS-52)
stable_frames: 3
stable_position_m: 0.005
stable_heading_deg: 5
match_distance_m: 0.05

# Vision check that a held fish is still on the gripper (hold_monitor.py). All "tune".
hold:
  use_mask: true            # the fish's outline stays where it was in the image
  use_depth: true           # the surface close to the camera stays at its distance
  near_m: 0.25              # a held fish is closer than this; the table is farther
  depth_tolerance_m: 0.04
  min_depth_share: 0.5
  min_region_share: 0.03
  min_iou: 0.5
  lost_frames: 3
